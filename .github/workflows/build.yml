name: Build

on:
  push:
    branches:
      - forge/1.20.1
    tags:
      - "v*"
  pull_request:
    branches:
      - forge/1.20.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Forge 1.20.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base_version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
            if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::mod_version must be a major.minor.patch version"
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="$major.$minor.$((patch + GITHUB_RUN_NUMBER))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17 runtime toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 21 build toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build "-Pmod_version=$MOD_VERSION"

      - name: Stage runtime JAR
        shell: bash
        run: |
          mkdir -p staging
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} staging/ \;
          test "$(find staging -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ae2emi-forge-1.20.1-${{ github.run_number }}
          path: staging/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/forge/1.20.1' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/forge/1.20.1')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Never replace an unrelated release if a manually created tag collides.
          git fetch --tags origin
          tagged_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || true)
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag $RELEASE_TAG already points to a different commit"
            exit 1
          fi
          if assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            # Retries preserve published assets and repair an incomplete upload.
            for jar in staging/*.jar; do
              if ! grep -Fxq "$(basename "$jar")" <<< "$assets"; then
                gh release upload "$RELEASE_TAG" "$jar"
              fi
            done
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" staging/*.jar \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
