plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = mapping_version
        minecraftVersion = minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    modImplementation "appeng:appliedenergistics2-forge:${ae2_version}"
    modImplementation "dev.emi:emi-forge:${emi_version}+${minecraft_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_license      : mod_license,
            mod_authors      : mod_authors,
            mod_credits      : mod_credits,
            mod_description  : mod_description,
            minecraft_version: minecraft_version,
            forge_version    : forge_version,
            ae2_version      : ae2_version,
            emi_version      : emi_version
    ]
    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE.txt') {
        rename { "LICENSE_${archives_base_name}.txt" }
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}
